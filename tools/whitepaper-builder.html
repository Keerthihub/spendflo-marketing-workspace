<script>
window.SF_BUILDER = {

      mk('cover',function(b){b.title='The Hidden Gap in ERP Financial Controls';b.sub='Why most spend decisions happen before finance systems ever see them';}),
      mk('heading',function(b){b.variant='numbered';b.num='1';b.head='Executive Summary';}),
      mk('text',function(b){b.variant='lead';b.paras=['CFOs rely on ERP systems as the backbone of financial governance. But there is a structural gap: by the time a purchase reaches the ERP, the spend decision has already been made.'];}),
      mk('stats'),
      mk('heading',function(b){b.variant='numbered';b.num='2';b.head='The ERP Promise vs. the Financial Reality';}),
      mk('text',function(b){b.paras=['ERP systems excel at processing structured transactions. The problem is scope: they were built for financial recording, not procurement decision-making — so the real decisions still happen elsewhere.'];}),
      mk('callout'),
      mk('table'),
      mk('heading',function(b){b.variant='numbered';b.num='3';b.head='What Intake Means for Finance';}),
      mk('compare'),
      mk('heading',function(b){b.variant='numbered';b.num='4';b.head='A Roadmap for Finance Leaders';}),
      mk('steps'),
      mk('footer',function(b){b.variant='cta';})
    ];},
  builtin:[
    {name:'Hidden-gap report',desc:'Cover, numbered sections, stats, table, roadmap, CTA',make:function(REG,uid){function mk(t,f){var b=REG[t].make();if(f)f(b);return b;}return [mk('cover'),mk('heading',function(b){b.variant='numbered';b.num='1';b.head='Executive Summary';}),mk('text',function(b){b.variant='lead';}),mk('stats'),mk('heading',function(b){b.variant='numbered';b.num='2';b.head='The Reality';}),mk('text'),mk('callout'),mk('table'),mk('heading',function(b){b.variant='numbered';b.num='3';b.head='Roadmap';}),mk('steps'),mk('footer',function(b){b.variant='cta';})];}},
    {name:'Executive brief',desc:'Cover, summary, key points, quote, CTA',make:function(REG,uid){function mk(t,f){var b=REG[t].make();if(f)f(b);return b;}return [mk('cover',function(b){b.variant='minimal';}),mk('heading',function(b){b.variant='underline';b.head='Summary';}),mk('text',function(b){b.variant='lead';}),mk('list',function(b){b.variant='checks';}),mk('quote',function(b){b.variant='card';}),mk('footer',function(b){b.variant='cta';})];}},
