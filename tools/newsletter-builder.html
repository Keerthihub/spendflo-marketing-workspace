<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Spendflo · Newsletter Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>html,body{height:100%;margin:0}</style>
<script>
window.SF_BUILDER = {
  key:'newsletter', title:'Newsletter Builder', fileBase:'newsletter', mode:'flow', pageW:600, pageH:900,
  order:['header','heading','text','image','button','cols','quote','callout','stats','list','divider','spacer','footer'],
  defaultDoc:function(REG,uid){return ['header','heading','text','image','button','divider','footer'].map(function(t){var b=REG[t].make();b.id=uid();b.hidden=false;return b;});},
  builtin:[
    {name:'Product update',desc:'Header, hero, screenshot, CTA, footer',make:function(REG,uid){return ['header','heading','text','image','button','footer'].map(function(t){return REG[t].make();});}},
    {name:'Event invite',desc:'Header, title, details, RSVP button, footer',make:function(REG,uid){function mk(t,f){var b=REG[t].make();if(f)f(b);return b;}return [mk('header'),mk('cols'),mk('heading'),mk('text'),mk('button',function(b){b.variant='bar';b.align='center';}),mk('footer')];}},
    {name:'Monthly digest',desc:'Header, sections, stats, quote, footer',make:function(REG,uid){function mk(t,f){var b=REG[t].make();if(f)f(b);return b;}return [mk('header'),mk('heading'),mk('text'),mk('stats',function(b){b.variant='cards';}),mk('divider'),mk('heading'),mk('text'),mk('quote',function(b){b.variant='card';}),mk('footer')];}}
  ]
};
</script>
<script src="/tools/sf-builder.js?v=6"></script>
</head><body></body></html>
